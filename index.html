<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGIS Dashboard</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Georgia, "Times New Roman", serif;
        background-color: #f5f8fc;
        color: #2c3e50;
      }

      header {
        background-color: #c9dff2;
        padding: 25px 0;
        text-align: center;
        border-bottom: 1px solid #b5cde3;
      }

      header h1 {
        font-size: 32px;
        font-weight: normal;
        letter-spacing: 1px;
      }

      .container {
        width: 95%;
        margin: 25px auto;
      }

      .dashboard {
        background: #ffffff;
        border: 1px solid #d9e4ef;
        padding: 12px;
        border-radius: 8px;
      }

      .dashboard img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 5px;
      }

      footer {
        text-align: center;
        padding: 15px;
        font-size: 14px;
        color: #6b7b8c;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>WebGIS Dashboard</h1>
    </header>

    <div class="container">
      <div class="dashboard">
        <img src="dashboard.png" alt="Dashboard WebGIS" />
      </div>
    </div>

    <footer>Sistem Informasi Geografis Berbasis Web</footer>
  </body>
</html>
